<!DOCTYPE html>
<html>
<head>
<title>Login page</title>
<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:Arial;
}
body{
 background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c92d2);
 background-size:400% 400%;
 animation:moveBG 10s infinite;
}
@keyframes moveBG{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}
nav{
 position:sticky;
 top:0;
 background:rgba(0,0,0,0.6);
 color:white;
 padding:15px;
 display:flex;
 justify-content:space-between;
}
.hero{
 text-align:center;
 color:white;
 padding:40px;
}
.hero h1{
 font-size:35px;
}
.container{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
 gap:20px; padding:20px;
}
.card{
 background:rgba(255,255,255,0.12);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,0.2);
 border-radius:12px;
 padding:20px;
 color:white;
 text-align:center;
 transition:0.3s;
}
.card:hover{
 transform:translateY(-10px);
}
input{
 width:100%;
 padding:10px;
 margin:6px 0;
 border:none;
 border-radius:6px;
 outline:none;
}
button{
 width:100%;
 padding:10px;
 border:none;
 border-radius:6px;
 background:linear-gradient(90deg,#00c6ff,#0072ff);
 color:white;
 cursor:pointer;
 transition:0.3s;
}
button:hover{
 transform:scale(1.05);
}
.services{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:15px;
 padding:20px;
}
.service-box{
 background:rgba(255,255,255,0.1);
 color:white;
 padding:15px;
 text-align:center;
 border-radius:10px;
 transition:0.3s;
}
.service-box:hover{
 background:#00c6ff; transform:scale(1.05);
}
</style>
</head>
<body>
<div style="max-width:360px;margin:20px auto;">
	<div class="card">
		<h3>Login</h3>
		<input type="text" placeholder="Mobile">
		<input type="password" placeholder="Password">
		<button>Login</button>
	</div>
</div>
<div class="container">
	<div class="card">
		<h3>Services</h3>
		<p>Content goes here.</p>
	</div>
</div>
</body>
</html>
